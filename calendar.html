<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sakhi Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:#fff7fb;color:#4a2340;display:flex;height:100vh;overflow:hidden;}

.sidebar{width:220px;background:#fff;border-right:1px solid #f7dce9;padding:20px 14px;display:flex;flex-direction:column;}
.logo{font-size:20px;font-weight:700;color:#8e2b5c;margin-bottom:24px;padding:0 8px;display:flex;align-items:center;gap:10px;}
.logo-dot{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#ff6b9d,#b06bd6);display:grid;place-items:center;color:#fff;font-size:16px;}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:#8a5c7c;text-decoration:none;margin-bottom:2px;cursor:pointer;}
.nav:hover{background:#ffeef6;color:#c9427e;}
.nav.active{background:linear-gradient(100deg,#ffd6e8,#f2d5f7);color:#8e2b5c;font-weight:600;}
.user{margin-top:auto;padding:10px;background:#fff8fb;border:1px solid #f7dce9;border-radius:12px;font-size:12px;}
.user strong{display:block;color:#5c2a4c;font-size:13px;margin-bottom:2px;}
.user span{color:#a5839a;}

.main{flex:1;overflow-y:auto;padding:24px;}
.head{margin-bottom:18px;}
.head h1{font-size:22px;color:#5c2a4c;}
.head h1 span{background:linear-gradient(90deg,#e8558f,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.card{background:#fff;border:1px solid #f7dce9;border-radius:18px;padding:18px;box-shadow:0 10px 24px -20px rgba(201,66,126,.35);}

.cal-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.cal-top button{width:34px;height:34px;border:1px solid #f7dce9;background:#fff8fb;border-radius:10px;cursor:pointer;color:#c07ba0;font-size:16px;font-family:inherit;}
.cal-top button:hover{background:#ffeef6;color:#c9427e;}
.cal-month{font-size:18px;font-weight:600;color:#5c2a4c;flex:1;text-align:center;}

.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
.dow div{text-align:center;font-size:10.5px;font-weight:600;color:#c8a0ba;text-transform:uppercase;padding:6px 0;}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:13px;color:#7c3a5c;cursor:pointer;border:1.5px solid transparent;background:none;font-family:inherit;}
.day:hover{background:#fff5fa;}
.day.empty{visibility:hidden;cursor:default;}
.day.period{background:linear-gradient(135deg,#ffd0e2,#ffb8d4);color:#8e2b5c;font-weight:700;}
.day.predicted{background:#fff2f8;color:#c9427e;border:1.5px dashed #ffb3d1;font-weight:600;}
.day.fertile{background:#f3e6ff;color:#7c3a9e;font-weight:600;}
.day.ovulation{background:linear-gradient(135deg,#c9a3f0,#b06bd6);color:#fff;font-weight:700;}
.day.today{border-color:#ff6b9d;font-weight:700;}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #fbeaf3;font-size:11px;color:#8a5c7c;}
.legend span{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;}
.legend .p{background:linear-gradient(135deg,#ffd0e2,#ffb8d4);}
.legend .pr{background:#fff2f8;border:1px dashed #ffb3d1;}
.legend .f{background:#f3e6ff;}
.legend .o{background:linear-gradient(135deg,#c9a3f0,#b06bd6);}

.side h3{font-size:14px;color:#7c3a5c;margin-bottom:12px;}
.row{display:flex;justify-content:space-between;padding:10px 12px;background:#fff8fb;border-radius:10px;margin-bottom:8px;font-size:12.5px;}
.row .lbl{color:#a5839a;}
.row .val{font-weight:600;color:#5c2a4c;}
.add-btn{width:100%;padding:12px;border:none;border-radius:11px;background:linear-gradient(100deg,#ff7fa9,#b06bd6);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;}

.overlay{position:fixed;inset:0;background:rgba(74,35,64,.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:22px;padding:28px;max-width:380px;width:100%;box-shadow:0 30px 60px -20px rgba(201,66,126,.5);}
.modal h2{font-size:18px;color:#5c2a4c;margin-bottom:6px;}
.modal p{font-size:13px;color:#a5839a;margin-bottom:18px;line-height:1.5;}
.modal input{width:100%;padding:10px;border:1.5px solid #f7dce9;border-radius:10px;font-family:inherit;font-size:13.5px;background:#fff8fb;outline:none;margin-bottom:12px;}
.modal-btn{width:100%;padding:12px;border:none;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:8px;}
.modal-btn.primary{background:linear-gradient(100deg,#ff7fa9,#b06bd6);color:#fff;}
.modal-btn.danger{background:#fff5f5;color:#c53030;border:1.5px solid #fbd5d5;}
.modal-btn.ghost{background:#fff8fb;color:#8a5c7c;border:1px solid #f7dce9;}

.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-130%);padding:12px 20px;background:#fff;border-radius:12px;box-shadow:0 15px 40px -12px rgba(201,66,126,.45);font-size:13px;color:#4a2340;transition:transform .4s;z-index:200;}
.toast.show{transform:translate(-50%,0);}

@media(max-width:900px){.grid{grid-template-columns:1fr;}}
@media(max-width:700px){.sidebar{display:none;}.main{padding:16px;}}
</style>
</head>
<body>

<div class="toast" id="toast">Saved!</div>

<div class="sidebar">
  <div class="logo"><span class="logo-dot">🌸</span> Sakhi</div>
  <a class="nav" href="dashboard.html">📊 Dashboard</a>
  <a class="nav" href="chatbot.html">💬 Health Assistant</a>
  <a class="nav active">📅 Calendar</a>
  <a class="nav" href="insights.html">📈 Insights</a>
  <div class="user">
    <strong id="uName">User</strong>
    <span id="uTag">normal</span>
  </div>
</div>

<div class="main">
  <div class="head">
    <h1>Your <span>calendar</span></h1>
  </div>

  <div class="grid">
    <div class="card">
      <div class="cal-top">
        <button id="prev">‹</button>
        <div class="cal-month" id="title">—</div>
        <button id="next">›</button>
      </div>
      <div class="dow">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
        <div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days" id="days"></div>
      <div class="legend">
        <span><span class="p"></span>Period</span>
        <span><span class="pr"></span>Predicted</span>
        <span><span class="f"></span>Fertile</span>
        <span><span class="o"></span>Ovulation</span>
      </div>
    </div>

    <div class="card side">
      <h3>This month</h3>
      <div class="row"><span class="lbl">Period days</span><span class="val" id="sPeriod">—</span></div>
      <div class="row"><span class="lbl">Fertile days</span><span class="val" id="sFertile">—</span></div>
      <div class="row"><span class="lbl">Ovulation</span><span class="val" id="sOv">—</span></div>
      <div class="row"><span class="lbl">Next period</span><span class="val" id="sNext">—</span></div>
      <button class="add-btn" id="addBtn">+ Log period</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle">—</h2>
    <p id="mSub">—</p>
    <div id="mBody"></div>
  </div>
</div>

<script>
function get(k,f){try{return JSON.parse(localStorage.getItem(k))||f;}catch(e){return f;}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

const user = get('sakhi_user',null) || {fullName:'Guest',condition:'normal'};
const firstName = user.fullName.trim().split(/\s+/)[0];
const condition = (user.condition||'normal').toLowerCase();
document.getElementById('uName').textContent = user.fullName;
document.getElementById('uTag').textContent = condition.toUpperCase();

const CFG = {
  normal:{cycle:28,period:5},
  pcod:{cycle:35,period:6},
  pcos:{cycle:35,period:6}
}[condition] || {cycle:28,period:5};

const MS = 86400000;
function strip(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function add(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function same(a,b){return ymd(a)===ymd(b);}

const today = strip(new Date());

function load(){
  const raw = get('sakhi_period_history',null);
  if(Array.isArray(raw)&&raw.length) return raw;
  const seed = [];
  for(let i=6;i>=1;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i*CFG.cycle+Math.round((Math.random()-0.5)*3));
    seed.push({date:ymd(d),length:CFG.period});
  }
  set('sakhi_period_history',seed);
  return seed;
}
let history = load();
history.sort((a,b)=>new Date(b.date)-new Date(a.date));

function buildIntervals(){
  if(!history.length) return [];
  const ivs = history.map(h=>({
    start:strip(new Date(h.date)),
    end:add(strip(new Date(h.date)),(h.length||CFG.period)-1)
  }));
  ivs.sort((a,b)=>a.start-b.start);
  const merged = [];
  for(const iv of ivs){
    if(!merged.length){merged.push({start:iv.start,end:iv.end});continue;}
    const last = merged[merged.length-1];
    if(iv.start<=add(last.end,1)){
      if(iv.end>last.end) last.end=iv.end;
    } else merged.push({start:iv.start,end:iv.end});
  }
  return merged;
}
let intervals = buildIntervals();
let lastPeriod = history.length ? strip(new Date(history[0].date)) : today;

function avgCycle(){
  if(history.length<2) return CFG.cycle;
  const c = history.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  const gaps = [];
  for(let i=1;i<c.length;i++){
    const g = Math.round((new Date(c[i].date)-new Date(c[i-1].date))/MS);
    if(g>5&&g<90) gaps.push(g);
  }
  if(!gaps.length) return CFG.cycle;
  const last3 = gaps.slice(-3);
  return Math.round(last3.reduce((a,b)=>a+b,0)/last3.length);
}
let effCycle = avgCycle();

function inPeriod(date){
  const t = strip(date).getTime();
  let lo=0, hi=intervals.length-1;
  while(lo<=hi){
    const mid = (lo+hi)>>1;
    const iv = intervals[mid];
    if(t<iv.start.getTime()) hi=mid-1;
    else if(t>iv.end.getTime()) lo=mid+1;
    else return true;
  }
  return false;
}

function predict(date){
  if(date<lastPeriod) return null;
  const diff = Math.round((strip(date)-lastPeriod)/MS);
  const mod = ((diff%effCycle)+effCycle)%effCycle;
  const day = mod+1;
  const ov = effCycle-14;
  if(day<=CFG.period) return 'predicted';
  if(day===ov) return 'ovulation';
  if(day>=ov-5&&day<=ov+1) return 'fertile';
  return null;
}

function classify(date){
  if(inPeriod(date)) return 'period';
  return predict(date);
}

let vY = today.getFullYear();
let vM = today.getMonth();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function render(){
  document.getElementById('title').textContent = MONTHS[vM]+' '+vY;
  const days = document.getElementById('days');
  days.innerHTML = '';

  const first = new Date(vY,vM,1).getDay();
  const total = new Date(vY,vM+1,0).getDate();

  for(let i=0;i<first;i++){
    const e = document.createElement('div');
    e.className = 'day empty';
    days.appendChild(e);
  }

  for(let d=1;d<=total;d++){
    const date = new Date(vY,vM,d);
    const btn = document.createElement('button');
    btn.className = 'day';
    const cls = classify(date);
    if(cls) btn.classList.add(cls);
    if(same(date,today)) btn.classList.add('today');
    btn.textContent = d;
    btn.addEventListener('click',()=>openModal(date));
    days.appendChild(btn);
  }

  updateSummary();
}

function updateSummary(){
  let p=0,f=0,ov=null;
  const total = new Date(vY,vM+1,0).getDate();
  for(let d=1;d<=total;d++){
    const date = new Date(vY,vM,d);
    const c = classify(date);
    if(c==='period') p++;
    if(c==='fertile') f++;
    if(c==='ovulation') ov = date;
  }
  document.getElementById('sPeriod').textContent = p+' days';
  document.getElementById('sFertile').textContent = f+' days';
  document.getElementById('sOv').textContent = ov ? ov.toLocaleDateString('en-US',{day:'numeric',month:'short'}) : '—';

  let next = add(lastPeriod,effCycle);
  while(next<today) next = add(next,effCycle);
  const toNext = Math.round((next-today)/MS);
  document.getElementById('sNext').textContent = toNext===0 ? 'Today' : toNext+' days';
}

document.getElementById('prev').addEventListener('click',()=>{vM--;if(vM<0){vM=11;vY--;}render();});
document.getElementById('next').addEventListener('click',()=>{vM++;if(vM>11){vM=0;vY++;}render();});

const overlay = document.getElementById('overlay');
const mTitle = document.getElementById('mTitle');
const mSub = document.getElementById('mSub');
const mBody = document.getElementById('mBody');
let selected = null;

function openModal(date){
  selected = date;
  const cls = classify(date);
  mTitle.textContent = date.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
  const labels = {period:'Period day',predicted:'Predicted period',ovulation:'Ovulation day',fertile:'Fertile window'};
  mSub.textContent = labels[cls] || 'Regular day';
  mBody.innerHTML = '';

  if(cls==='period'){
    const b = document.createElement('button');
    b.className = 'modal-btn danger';
    b.textContent = 'Remove this period';
    b.onclick = removePeriod;
    mBody.appendChild(b);
  } else {
    const input = document.createElement('input');
    input.type = 'number';
    input.id = 'lenInput';
    input.value = CFG.period;
    input.min = 1;
    input.max = 15;
    input.placeholder = 'Duration (days)';
    mBody.appendChild(input);

    const b = document.createElement('button');
    b.className = 'modal-btn primary';
    b.textContent = 'Log period starting here';
    b.onclick = ()=>logPeriod(parseInt(input.value,10));
    mBody.appendChild(b);
  }

  const c = document.createElement('button');
  c.className = 'modal-btn ghost';
  c.textContent = 'Close';
  c.onclick = closeModal;
  mBody.appendChild(c);

  overlay.classList.add('show');
}

function closeModal(){overlay.classList.remove('show');}
overlay.addEventListener('click',e=>{if(e.target===overlay) closeModal();});

function logPeriod(len){
  if(!len||len<1||len>15){toast('Duration 1-15');return;}
  const d = ymd(selected);
  if(history.some(h=>h.date===d)){toast('Already logged');return;}
  history.push({date:d,length:len});
  history.sort((a,b)=>new Date(b.date)-new Date(a.date));
  set('sakhi_period_history',history);
  intervals = buildIntervals();
  lastPeriod = history.length ? strip(new Date(history[0].date)) : today;
  effCycle = avgCycle();
  render();
  closeModal();
  toast('Period logged 🌸');
}

function removePeriod(){
  const t = strip(selected).getTime();
  const idx = history.findIndex(h=>{
    const s = strip(new Date(h.date)).getTime();
    const e = s+((h.length||CFG.period)-1)*MS;
    return t>=s&&t<=e;
  });
  if(idx===-1){toast('Not found');return;}
  history.splice(idx,1);
  set('sakhi_period_history',history);
  intervals = buildIntervals();
  lastPeriod = history.length ? strip(new Date(history[0].date)) : today;
  effCycle = avgCycle();
  render();
  closeModal();
  toast('Removed');
}

document.getElementById('addBtn').addEventListener('click',()=>openModal(today));

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
